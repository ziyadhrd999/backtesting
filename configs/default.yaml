engine:
  initial_cash: 100000
  fee_bps: 0.25
  slippage_bps: 1.0
  spread_bps: 0.5
  annualization: 252
  latency_bars: 0
  max_abs_weight: 2.0
  allow_short: false
  borrow_rate_bps: 0.2
  financing_bars_per_year: 252
  stop_loss_mode: pct
  stop_loss_value: 0.05
  stop_cooldown_bars: 5
  max_trades_per_day: 5
  trade_cap_side: buy

strategy:
  name: moving_average
  fast_window: 20
  slow_window: 100

data:
  source: yfinance
  symbols: [NVDA, MSFT, AAPL]
  max_symbols: 3
  period: 2y
  interval: 60m
  auto_adjust: true

analytics:
  rolling_window: 20

benchmark:
  enabled: false
  data:
    source: yfinance
    symbol: SPY
    period: 2y
    interval: 1d
    auto_adjust: true
